<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" version="1.1">
  <!--
    Extra Big Variant: Enlarges the S even further while keeping the sleek gradient. The letter now
    stretches close to the bounds of the rounded square, maximising impact without overflowing.
  -->
  <defs>
    <linearGradient id="bgExtra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#091f3a"/>
    </linearGradient>
    <linearGradient id="sGradExtra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C300FF"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>
  </defs>
  <rect x="50" y="50" width="700" height="700" rx="120" ry="120" fill="url(#bgExtra)"/>
  <text x="400" y="480" text-anchor="middle" dominant-baseline="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="650" font-size="680"
        fill="url(#sGradExtra)">
    S
  </text>
</svg>