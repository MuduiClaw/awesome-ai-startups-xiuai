name: Daily Scrape

on:
  # schedule:
  #   - cron: "0 6 * * *" # 06:00 UTC daily — disabled, scrapers paused
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # ── Scrapers disabled ─────────────────────────────────────────────
      # To re-enable, uncomment the schedule trigger above and the
      # scraper steps below.
      #
      # - name: Discovery phase
      # - name: Scrape (API-based sources)
      # - name: Scrape (browser-based sources)
      # - name: Enrichment phase
      # - name: LLM enrichment
      # ─────────────────────────────────────────────────────────────────

      - name: Migrate categories (normalize legacy values)
        run: python scripts/migrate_categories.py

      - name: Validate all data
        run: aiscrape validate

      - name: Rebuild SQLite database
        run: aiscrape init-db

      - name: Generate stats and index
        run: aiscrape generate-stats

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main || {
              echo "Rebase conflict detected, resolving..."
              git rebase --abort
              git stash
              git pull origin main
              git stash pop
              aiscrape generate-stats
              git add data/
              git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
            }
            git push
          fi
